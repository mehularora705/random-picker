
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Picker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111827;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 500px;
  text-align: center;
  background: #1f2937;
  padding: 35px 25px;
  border-radius: 22px;
  box-shadow: 0 15px 50px #0005;
}

h1 {
  margin-top: 0;
  font-size: 30px;
}

.subtitle {
  color: #9ca3af;
  margin-bottom: 30px;
}

.wheel-area {
  margin: 35px auto 20px;
  padding: 30px 15px;
  border: 3px solid #6366f1;
  border-radius: 18px;
  background: #111827;
}

.pointer {
  color: #a5b4fc;
  font-size: 25px;
  margin-bottom: 10px;
}

#result {
  font-size: 30px;
  font-weight: bold;
  min-height: 75px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-wrap: anywhere;
  color: #a5b4fc;
}

.details {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 20px auto 25px;
}

.detail-box {
  background: #111827;
  border: 2px solid #374151;
  border-radius: 14px;
  padding: 18px 12px;
  min-width: 0;
}

.detail-label {
  color: #9ca3af;
  font-size: 13px;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.detail-value {
  color: #a5b4fc;
  font-size: 19px;
  font-weight: bold;
  min-height: 45px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-wrap: anywhere;
}

#resultC {
  display: inline-block;
  background: #6366f1;
  color: white;
  padding: 10px 14px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
  pointer-events: none;
  opacity: 0.5;
}

#resultC.active {
  pointer-events: auto;
  opacity: 1;
}

#resultC.active:hover {
  background: #4f46e5;
}

button {
  border: none;
  padding: 16px 35px;
  border-radius: 50px;
  background: #6366f1;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #4f46e5;
  transform: scale(1.04);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

#status {
  margin-top: 25px;
  font-size: 13px;
  color: #9ca3af;
}

.count {
  color: #a5b4fc;
  margin-top: 15px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

  <h1>🎯 Random Picker</h1>

  <div class="subtitle">
    Let fate decide!
  </div>

  <!-- COLUMN A: MAIN RESULT -->

  <div class="wheel-area">
    <div class="pointer">▼</div>
    <div id="result">Loading...</div>
  </div>

  <!-- COLUMN B AND C RESULTS -->

  <div class="details">

    <div class="detail-box">
      <div class="detail-label">Column B</div>
      <div class="detail-value" id="resultB">---</div>
    </div>

    <div class="detail-box">
      <div class="detail-label">Column C</div>

      <div class="detail-value">
        <a id="resultC"
           href="#"
           target="_blank"
           rel="noopener noreferrer">
          🔗 Open Link
        </a>
      </div>

    </div>

  </div>

  <button id="spinBtn" onclick="spin()" disabled>
    SPIN
  </button>

  <div class="count" id="count">
    Loading options...
  </div>

  <div id="status">
    Connecting to Google Sheets...
  </div>

</div>


<script>

// ===================================
// GOOGLE SHEET SETTINGS
// ===================================

const SHEET_ID = "1M7qQPXaLc9zJs1Jen34T1n2Ws-ZWiWL5aeMj5B7L9jU";

const SHEET_GID = "0";

// Fetch columns A, B and C
const COLUMNS = "A,B,C";

// Is the first row a heading?
const SKIP_HEADER = false;


// ===================================
// LOAD DATA FROM GOOGLE SHEETS
// ===================================

let options = [];
let spinning = false;


// ===================================
// LOAD GOOGLE SHEET IN BATCHES
// ===================================

let requestCounter = 0;

function fetchSheetBatch(offset, limit) {

  return new Promise((resolve, reject) => {

    const callbackName = "handleSheetBatch_" + (++requestCounter);

    const query =
      `select A,B,C limit ${limit} offset ${offset}`;

    const url =
  "https://docs.google.com/spreadsheets/d/" +
  SHEET_ID +
  "/gviz/tq?gid=" +
  SHEET_GID +
  "&headers=1" +
  "&tq=" +
  encodeURIComponent(query) +
  "&tqx=" +
  encodeURIComponent(
    "out:json;responseHandler:" + callbackName
  );

    const script = document.createElement("script");

    function cleanup() {
      delete window[callbackName];
      script.remove();
    }

    window[callbackName] = function(response) {

      cleanup();

      if (!response || response.status === "error") {
        reject(new Error("Google Sheets batch request failed"));
        return;
      }

      resolve(response.table.rows || []);

    };

    script.onerror = function() {
      cleanup();
      reject(new Error("Unable to connect to Google Sheets"));
    };

    script.src = url;
    document.body.appendChild(script);

  });

}


async function loadSheetData() {

  const status = document.getElementById("status");
  const count = document.getElementById("count");
  const button = document.getElementById("spinBtn");

  status.innerText = "Connecting to Google Sheets...";
  count.innerText = "Loading options...";
  button.disabled = true;

  try {

    const batchSize = 50;

    let offset = 0;
    let allRows = [];

    // Fetch rows in batches of 50
    while (true) {

      status.innerText =
        "Fetching rows " + (offset + 1) +
        " onwards...";

      const rows = await fetchSheetBatch(offset, batchSize);

      if (rows.length === 0) {
        break;
      }

      allRows = allRows.concat(rows);

      offset += rows.length;

      // Last batch reached
      if (rows.length < batchSize) {
        break;
      }

    }

    // Extract columns A, B and C
    options = allRows.map(row => {

      const getValue = (index) => {

        const cell = row.c[index];

        return cell
          ? (cell.f ?? cell.v ?? "")
          : "";

      };

      return {
        A: String(getValue(0)).trim(),
        B: String(getValue(1)).trim(),
        C: String(getValue(2)).trim()
      };

    }).filter(row => row.A !== "");

    // Update interface
    count.innerText =
      options.length + " options available";

    status.innerText =
      "✓ Connected | Google returned: " +
      allRows.length +
      " rows | Valid options: " +
      options.length;

    document.getElementById("result").innerText =
      options.length ? "Ready to spin!" : "No options found";

    document.getElementById("resultB").innerText = "---";

    resetLink();

    button.disabled = options.length === 0;

    console.log("Total rows fetched:", allRows.length);
    console.log("Valid options:", options.length);

  } catch(error) {

    status.innerText = "Error: " + error.message;

    count.innerText = "Unable to load options";

    document.getElementById("result").innerText =
      "Unable to load options";

    button.disabled = true;

    console.error(error);

  }

}



// ===================================
// RANDOM SELECTION
// ===================================

function randomIndex(max) {

  const values = new Uint32Array(1);

  crypto.getRandomValues(values);

  return Math.floor(
    (values[0] / 4294967296) * max
  );

}


// ===================================
// RESET COLUMN C LINK
// ===================================

function resetLink() {

  const link = document.getElementById("resultC");

  link.removeAttribute("href");
  link.classList.remove("active");
  link.innerText = "🔗 Open Link";

}


// ===================================
// SPIN ANIMATION
// ===================================

function spin() {

  if (spinning || options.length === 0) return;

  spinning = true;

  const button = document.getElementById("spinBtn");
  const result = document.getElementById("result");

  const resultB = document.getElementById("resultB");

  button.disabled = true;
  button.innerText = "SPINNING...";

  // Clear previous results
  resultB.innerText = "---";
  resetLink();

  result.style.color = "#a5b4fc";

  // Select one complete row
  const winner = options[randomIndex(options.length)];

  let ticks = 0;

  const totalTicks = 25 + Math.floor(Math.random() * 15);

  const timer = setInterval(() => {

    // Random animation using Column A
    const randomOption = options[randomIndex(options.length)];

    result.innerText = randomOption.A;

    ticks++;

    if (ticks >= totalTicks) {

      clearInterval(timer);

      // Display winning Column A value
      result.innerText = "🎉 " + winner.A;

      result.style.color = "#34d399";

      // Display corresponding Column B
      resultB.innerText = winner.B || "---";

      // Display corresponding Column C as clickable link
      const link = document.getElementById("resultC");

      if (winner.C && /^https?:\/\//i.test(winner.C)) {

        link.href = winner.C;
        link.innerText = "🔗 Open Link";
        link.classList.add("active");

      } else {

        link.innerText = winner.C || "No Link";
        link.removeAttribute("href");
        link.classList.remove("active");

      }

      button.disabled = false;
      button.innerText = "SPIN AGAIN";

      spinning = false;

      document.getElementById("status").innerText =
        "Winner selected!";

    }

  }, 100 + ticks * 3);

}


// ===================================
// LOAD SHEET WHEN WEBSITE OPENS
// ===================================

loadSheetData();

</script>

</body>
</html>
